<!doctype html>

  <body>
    <a class="skip-link" href="#main" data-i18n="skip">跳至主要內容</a>

      <div class="workspace">

          <div

        <div id="settings-nav" class="navigation-category" data-nav-group="settings">
          <button
            type="button"
            class="nav-item nav-category"
            data-nav-trigger="settings"
            data-i18n-title="settingsNavigation"
            aria-expanded="false"
            aria-controls="nav-settings-menu"
            popovertarget="nav-settings-menu"
            popovertargetaction="show"
            aria-haspopup="true"
          >
            <span data-icon="settings"></span
            ><span class="nav-label" data-i18n="settingsNavigation"></span
            ><span class="nav-chevron" data-icon="right"></span>
          </button>
          <div
            id="nav-settings-menu"
            class="nav-flyout"
            data-nav-popover
            popover
            aria-label="settingsNavigation"
            data-i18n-aria="settingsNavigation"

              ><span data-icon="settings"></span
              ><span class="nav-label" data-i18n="settings"></span
            ></a>
          </div>
        </div>
        <div id="management-nav" class="navigation-category" data-nav-group="management">
          <button
            type="button"
            class="nav-item nav-category"
            data-nav-trigger="management"
            data-i18n-title="managementNavigation"
            aria-expanded="false"
            aria-controls="nav-management-menu"
            popovertarget="nav-management-menu"
            popovertargetaction="show"
            aria-haspopup="true"
          >
            <span data-icon="shield"></span
            ><span class="nav-label" data-i18n="managementNavigation"></span
            ><span class="nav-chevron" data-icon="right"></span>
          </button>
          <div
            id="nav-management-menu"
            class="nav-flyout"
            data-nav-popover
            popover
            aria-label="managementNavigation"
            data-i18n-aria="managementNavigation"
          >
            <a
              href="/administration/sites"
              class="nav-item"
              data-view="sites"
              data-i18n-title="sites"
              data-system-only
              ><span data-icon="grid"></span
              ><span class="nav-label" data-i18n="sites"></span></a
            ><a
              href="/administration/users"
              class="nav-item"
              data-view="users"
              data-i18n-title="users"
              data-admin-only
              ><span data-icon="users"></span><span class="nav-label" data-i18n="users"></span
            ></a>
          </div>
        </div>
        <div id="help-nav" class="navigation-category" data-nav-group="help">
          <button
            type="button"
            class="nav-item nav-category"
            data-nav-trigger="help"
            data-i18n-title="helpNavigation"
            aria-expanded="false"
            aria-controls="nav-help-menu"
            popovertarget="nav-help-menu"
            popovertargetaction="show"
            aria-haspopup="true"
          >
            <span data-icon="book"></span
            ><span class="nav-label" data-i18n="helpNavigation"></span
            ><span class="nav-chevron" data-icon="right"></span>
          </button>
          <div
            id="nav-help-menu"
            class="nav-flyout"
            data-nav-popover
            popover
            aria-label="helpNavigation"
            data-i18n-aria="helpNavigation"
          >
            <a href="/guide" class="nav-item" data-view="help" data-i18n-title="help"
              ><span data-icon="book"></span><span class="nav-label" data-i18n="help"></span
            ></a>
          </div>
        </div>
      </nav>
      <div class="sidebar-bottom">
        <div class="template-note" data-admin-only>
          <span data-icon="sliders"></span
          ><strong data-i18n="setupTitle">將報表變成你的工作方式</strong>
          <p data-i18n="setupDesc">在設定中管理產線、時間與外觀。</p>
          <a href="/settings/master-data" id="open-settings"
            ><span data-i18n="openSettings">前往系統設定</span> ↗</a
          >
        </div>
        <div class="sidebar-footer">
          <span class="online-dot"></span><span>BP PULSE</span><span>v2.0</span>
        </div>
      </div>
    </aside>
    <button
      type="button"
      class="navigation-scrim"
      id="navigation-scrim"
      data-i18n-aria="closeNavigation"
      hidden
    ></button>
    <div class="app-shell">
      <header class="topbar">
        <button
          type="button"
          class="icon-button"
          id="toggle-navigation"
          aria-controls="sidebar"
          aria-expanded="true"
          data-i18n-aria="toggleNavigation"
        >
          <span data-icon="panel"></span>
        </button>
        <div class="breadcrumb">
          <span>DELTA THAILAND</span><span>›</span><strong id="breadcrumb"></strong>
        </div>
        <div class="topbar-right">
          <span class="status" id="connection"><i></i><span data-i18n="syncing"></span></span
          ><label class="header-select"
            ><span data-icon="globe"></span
            ><select id="language-select" data-i18n-aria="language">
              <option value="zh">Chinese</option>
              <option value="en">English</option>
              <option value="th">Thai</option>
            </select></label
          ><label class="header-select theme-select"
            ><span data-icon="palette"></span
            ><select id="theme-select" data-i18n-aria="theme"></select></label
          ><label class="header-select site-selector"
            ><span data-i18n="accessSite"></span
            ><select id="site-select" data-i18n-aria="accessSite"></select></label
          ><span class="current-user" id="current-user"></span
          ><span class="user-avatar">BP</span
          ><button
            class="icon-button logout-button"
            id="logout"
            data-i18n-title="logout"
            data-i18n-aria="logout"
            hidden
          >
            <span data-icon="logout"></span>
          </button>
        </div>
      </header>
      <section id="personal-order-panel" class="personal-order-panel" popover></section>
      <main id="main" tabindex="-1">
        <div id="error-banner" class="error-banner" role="alert" hidden></div>
        <section class="page-heading">
          <div>
            <div class="eyebrow">
              <span></span><span data-i18n="intelligence">生產數據洞察</span>
            </div>
            <h1 id="page-title"></h1>
            <p id="page-description"></p>
          </div>
        </section>
        <section id="administration-content" class="access-management" hidden></section>
        <div id="report-content">
          <section class="filter-bar" data-i18n-aria="reportDate">
            <div class="filter-group">
              <label class="date-control"
                ><span data-icon="calendar"></span
                ><input id="report-date" type="date" data-i18n-aria="reportDate" /></label
              ><button class="button today-button" id="today" data-i18n="today"></button
              ><span class="filter-separator"></span>
              <div class="segmented">
                <button data-report-scope="all" class="selected" aria-pressed="true">
                  <span data-icon="layers"></span><span data-i18n="overviewAll"></span></button
                ><button data-report-scope="day" aria-pressed="false">
                  <span data-icon="sun"></span><span data-i18n="day"></span></button
                ><button data-report-scope="night" aria-pressed="false">
                  <span data-icon="moon"></span><span data-i18n="night"></span>
                </button>
              </div>
            </div>
            <div id="report-export-slot">
              <button class="button export-button" id="export" disabled>
                <span data-icon="download"></span><span data-i18n="export"></span>
              </button>
            </div>
            <div
              class="metric-scope-buttons"
              id="metric-scope-controls"
              role="group"
              data-i18n-aria="metricScope"
            >
              <button
                data-metric-scope="interval"
                aria-pressed="true"
                data-i18n="metricInterval"
              ></button>
              <button
                data-metric-scope="day"
                aria-pressed="false"
                data-i18n="metricDay"
              ></button>
            </div>
          </section>
          <section id="line-dashboard" hidden>
            <div class="board-header overview-tools">
              <span id="board-context" hidden></span>
              <div
                class="group-tabs"
                id="group-tabs"
                role="tablist"
                data-i18n-aria="group"
              ></div>
              <span id="board-site-name" class="board-site-label"></span>
              <div class="board-actions" id="overview-operations">
                <button
                  type="button"
                  class="button personal-order-open"
                  popovertarget="personal-order-panel"
                  data-i18n="personalOrder"
                ></button>

                <details class="board-display-options">
                  <summary data-i18n="displayOptions"></summary>
                  <div class="board-display-panel">
                    <strong data-i18n="boardDisplaySections"></strong>
                    <label
                      ><input type="checkbox" data-board-display="group" /><span
                        data-i18n="groupTotals"
                      ></span
                    ></label>
                    <label
                      ><input type="checkbox" data-board-display="alerts" /><span
                        data-i18n="boardShowAlerts"
                      ></span
                    ></label>
                    <label
                      ><input type="checkbox" data-board-display="filters" /><span
                        data-i18n="boardShowFilters"
                      ></span
                    ></label>
                    <label
                      ><input type="checkbox" data-board-display="header" /><span
                        data-i18n="boardShowHeader"
                      ></span
                    ></label>
                    <label
                      ><input type="checkbox" data-board-display="carousel" /><span
                        data-i18n="boardShowCarousel"
                      ></span
                    ></label>
                    <hr />
                    <label
                      ><input
                        type="checkbox"
                        id="board-show-trend"
                        data-board-display="trend" /><span data-i18n="groupTrend"></span></label
                    ><label
                      ><input
                        type="checkbox"
                        id="board-show-share"
                        data-board-display="share" /><span data-i18n="outputShare"></span
                    ></label>
                    <p data-i18n="boardDisplaySaved"></p>
                    <button
                      type="button"
                      class="button"
                      data-board-display-reset
                      data-i18n="boardDisplayReset"
                    ></button>
                  </div>
                </details>
                <button class="button" id="enter-fullscreen">
                  <span data-icon="fullscreen"></span
                  ><span data-i18n="fullscreen"></span></button
                ><button class="button" id="exit-fullscreen">
                  <span data-icon="close"></span><span data-i18n="exitFullscreen"></span>
                </button>
              </div>
            </div>
            <div
              id="group-summary"
              class="group-summary"
              role="region"
              data-i18n-aria="groupTotals"
            ></div>
            <div class="monitor-summary">
              <div
                id="monitor-status-filters"
                class="status-filters"
                role="group"
                data-i18n-aria="alertFilters"
              ></div>
              <span class="live-tag"><i></i><span data-i18n="live"></span></span
              ><span id="alert-summary"></span
              ><span id="refresh-interval" class="refresh-interval"></span
              ><button class="button" id="refresh-now">
                <span data-icon="refresh"></span><span data-i18n="refreshNow"></span>
              </button>
            </div>
            <div class="monitor-card-viewport" id="monitor-card-viewport">
              <div class="line-cards" id="line-cards"></div>
            </div>
            <div class="board-pagination" id="board-pagination"></div>
            <div class="dashboard-top-charts">
              <section class="panel group-trend-panel">
                <div class="panel-heading">
                  <div>
                    <h2 data-i18n="groupTrend"></h2>
                    <p data-i18n="groupTrendDesc"></p>
                  </div>
                </div>
                <div id="group-trend" class="group-trend"></div>
              </section>
              <section class="panel share-panel">
                <div class="panel-heading"><h2 data-i18n="outputShare"></h2></div>
                <div id="output-share"></div>
              </section>
            </div>
            <p class="monitor-hint" data-i18n="monitorHint"></p>
          </section>
          <section class="detail-filters panel" id="detail-filters" hidden>
            <label for="detail-group" data-i18n="group"></label
            ><select id="detail-group"></select
            ><label for="detail-line" data-i18n="line"></label
            ><select id="detail-line"></select>
          </section>
          <div class="detail-heading" id="detail-heading" hidden>
            <button class="button" id="back-overview">
              <span data-icon="left"></span><span data-i18n="backOverview"></span>
            </button>
            <div>
              <h2 id="detail-line-title"></h2>
            </div>
          </div>
          <section class="panel detail-alert-panel" data-page-alert-panel hidden>
            <strong data-page-status></strong>
            <p data-page-alert></p>
            <details>
              <summary data-i18n="alertDetails"></summary>
              <ul data-page-alert-list></ul>
            </details>
          </section>
          <div id="overview-panels" class="overview-panels">
            <section class="panel trend-panel">
              <div class="panel-heading">
                <div>
                  <h2 data-i18n="hourlyTrend"></h2>
                  <p data-i18n="hourlyDesc"></p>
                </div>
                <div class="legend">
                  <span><i class="target-legend"></i><span data-i18n="target"></span></span
                  ><span><i class="actual-legend"></i><span data-i18n="actual"></span></span>
                </div>
              </div>
              <div class="chart-line-filter">
                <label for="chart-line" data-i18n="chartLine"></label
                ><select id="chart-line"></select
                ><span class="point-key met-point"></span><span data-i18n="onTarget"></span
                ><span class="point-key missed-point"></span
                ><span data-i18n="belowTarget"></span>
              </div>
              <div id="chart" class="chart"></div>
              <div class="table-scroll interval-details">
                <table>
                  <thead>
                    <tr>
                      <th data-i18n="timeSlot"></th>
                      <th data-i18n="target"></th>
                      <th data-i18n="actual"></th>
                      <th data-i18n="gap"></th>
                      <th data-i18n="status"></th>
                    </tr>
                  </thead>
                  <tbody id="interval-details"></tbody>
                </table>
              </div>
              <div class="chart-bottom">
                <span data-icon="clock"></span><span id="break-summary"></span>
              </div>
            </section>
          </div>
          <section class="panel records-panel">
            <div class="panel-heading records-heading">
              <div>
                <div class="section-eyebrow" data-i18n="shopFloor"></div>
                <h2>
                  <span id="table-heading"></span
                  ><span class="count-badge" id="row-count">0</span>
                </h2>
                <p id="table-description"></p>
              </div>
              <div class="record-toolbar-actions">
                <button
                  class="button"
                  data-open-settings="structure"
                  data-settings-anchor="structure-schedule"
                  data-admin-only
                >
                  <span data-icon="clock"></span><span data-i18n="timeSettings"></span></button
                ><button class="button" id="refresh">
                  <span data-icon="refresh"></span><span data-i18n="refresh"></span>
                </button>
              </div>
            </div>
            <div class="table-tools">
              <div class="line-filter">
                <label for="line-select" data-i18n="line"></label
                ><select id="line-select"></select
                ><span class="line-total" id="line-total"></span>
              </div>
              <div class="table-tools-right">
                <label class="search-control"
                  ><span data-icon="search"></span
                  ><input
                    id="search"
                    data-i18n-placeholder="search"
                    data-i18n-aria="search"
                  /><kbd>/</kbd></label
                ><select id="status-select" data-i18n-aria="status">
                  <option value="all" data-i18n="allStatus"></option>
                  <option value="filled" data-i18n="filled"></option>
                  <option value="pending" data-i18n="pending"></option>
                  <option value="issue" data-i18n="hasIssue"></option>
                </select>
              </div>
            </div>
            <div
              class="slot-tabs"
              id="slot-tabs"
              role="tablist"
              data-i18n-aria="timeSlot"
            ></div>
            <div class="table-scroll">
              <table id="production-table">
                <colgroup>
                  <col class="col-entry" />
                  <col class="col-station" />
                  <col class="col-job" />
                  <col class="col-team" />
                  <col class="col-number" />
                  <col class="col-number" />
                  <col class="col-number" />
                  <col class="col-issue" />
                  <col class="col-status" />
                </colgroup>
                <thead>
                  <tr>
                    <th data-i18n="actions"></th>
                    <th data-i18n="lineStation"></th>
                    <th data-i18n="job"></th>
                    <th data-i18n="assignedStaff"></th>
                    <th class="number" data-i18n="target"></th>
                    <th class="number" data-i18n="actual"></th>
                    <th class="number" data-i18n="gap"></th>
                    <th data-i18n="issueOwner"></th>
                    <th data-i18n="status"></th>
                  </tr>
                </thead>
                <tbody id="records-body"></tbody>
              </table>
            </div>
            <div class="table-footer">
              <span id="table-summary"></span>
              <div class="pagination">
                <button class="icon-button" id="previous-page" data-i18n-aria="previous">
                  <span data-icon="left"></span></button
                ><span id="page-indicator">1 / 1</span
                ><button class="icon-button" id="next-page" data-i18n-aria="next">
                  <span data-icon="right"></span>
                </button>
              </div>
            </div>
          </section>
          <section id="entry-content" hidden></section>
        </div>
        <section id="help-content" hidden></section>
        <section id="settings-content" hidden>
          <div class="settings-notice">
            <span data-icon="info"></span><span data-i18n="settingsShared"></span>
          </div>
          <div id="setup-progress" class="setup-progress"></div>
          <div class="settings-tabs" role="tablist" data-i18n-aria="settings">
            <a
              href="/settings/master-data"
              role="tab"
              data-settings-tab="structure"
              aria-selected="true"
            ></a>
            <a
              href="/settings/daily-targets"
              role="tab"
              data-settings-tab="targets"
              aria-selected="false"
            ></a>
            <a
              href="/settings/people"
              role="tab"
              data-settings-tab="personnel"
              aria-selected="false"
            ></a>
            <a
              href="/settings/assignments"
              role="tab"
              data-settings-tab="staffing"
              aria-selected="false"
            ></a>
            <a
              href="/settings/line-configuration"
              role="tab"
              data-settings-tab="workforce"
              aria-selected="false"
            ></a>
            <a
              href="/settings/groups"
              role="tab"
              data-settings-tab="groups"
              aria-selected="false"
            ></a>
            <a
              href="/settings/alerts"
              role="tab"
              data-settings-tab="alerts"
              aria-selected="false"
            ></a>
            <a
              href="/settings/appearance"
              role="tab"
              data-settings-tab="appearance"
              aria-selected="false"
            ></a>
          </div>
          <div id="settings-error" class="error-banner" role="alert" hidden></div>
          <div class="settings-local-save">
            <p id="settings-draft-note" role="status"></p>
            <button
              type="button"
              class="button"
              id="reload-settings"
              data-i18n="loadSavedSettings"
            ></button>
            <button type="button" class="button primary" data-save-settings>
              <span data-icon="check"></span><span data-i18n="saveSettings"></span>
            </button>
          </div>
          <div id="settings-body" role="tabpanel"></div>
          <div class="setup-footer">
            <div>
              <strong data-i18n="saveSettings"></strong
              ><span id="settings-save-status" role="status"></span>
              <span id="setup-next-reason" role="status"></span>
            </div>
            <div class="setup-footer-actions">
              <button
                type="button"
                class="button"
                data-save-draft
                data-i18n="saveSettingsDraft"
              ></button>
              <button
                type="button"
                class="button"
                id="setup-next"
                aria-describedby="setup-next-reason"
              ></button>
              <button
                type="button"
                class="button primary"
                id="save-settings"
                data-save-settings
              >
                <span data-icon="check"></span><span data-i18n="saveSettings">儲存設定</span>
              </button>
            </div>
          </div>
        </section>
        <footer class="page-footer">
          <span><span class="footer-logo">BP PULSE</span><span data-i18n="footer"></span></span
          ><span id="last-updated"></span>
        </footer>
      </main>
    </div>
    <dialog
      id="line-detail-dialog"
      class="line-detail-dialog"
      aria-labelledby="line-modal-title"
    >
      <div id="line-detail-content"></div>
    </dialog>
    <dialog
      id="confirm-dialog"
      class="confirm-dialog"
      aria-labelledby="confirm-title"
      aria-describedby="confirm-description"
    >
      <span class="confirm-symbol" data-icon="alert"></span>
      <h2 id="confirm-title"></h2>
      <p id="confirm-description"></p>
      <div>
        <button class="button" id="confirm-no"></button
        ><button class="button primary" id="confirm-yes"></button>
      </div>
    </dialog>
    <dialog id="login-dialog" class="login-dialog" aria-labelledby="login-title">
      <div class="login-brand">
        <span class="brand-mark"><img src="/delta-logo.svg#symbol" alt="DELTA" /></span
        ><strong>BP PULSE</strong
        ><select id="login-language" aria-label="Language">
          <option value="zh">Chinese</option>
          <option value="en">English</option>
          <option value="th">Thai</option>
        </select>
      </div>
      <div class="section-eyebrow">BP9</div>
      <h1 id="login-title" data-i18n="loginTitle"></h1>
      <p class="login-description" data-i18n="loginDesc"></p>
      <form id="login-form" novalidate>
        <div id="login-error" class="error-banner" role="alert" hidden></div>
        <label
          ><span data-i18n="username"></span
          ><input
            id="login-username"
            name="username"
            autocomplete="username"
            maxlength="100"
            required /></label
        ><label
          ><span data-i18n="password"></span
          ><input
            id="login-password"
            name="password"
            type="password"
            autocomplete="current-password"
            maxlength="200"
            required /></label
        ><label class="access-check" id="login-remember-field"
          ><input type="checkbox" id="login-remember" /><span
            data-i18n="accessRememberMe"
          ></span
        ></label>
        <label id="login-site-field" hidden
          ><span data-i18n="accessSelectSite"></span
          ><select id="login-site"></select
        ></label>
        <p id="login-no-sites" data-i18n="accessNoSites" hidden></p>
        <button
          class="button"
          type="button"
          id="login-other-account"
          data-i18n="accessOtherAccount"
          hidden
        ></button>
        <button
          class="button primary"
          id="login-submit"
          type="submit"
          data-i18n="loginSubmit"
        ></button>
      </form>
      <p class="login-foot" data-i18n="loginFoot"></p>
    </dialog>
    <div id="trend-tooltip" class="trend-tooltip" role="tooltip" hidden></div>
    <div id="toast" class="toast" role="status" hidden></div>
  </body>
</html>
